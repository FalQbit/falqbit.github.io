<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FALQBIT Unlock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="./">FALQBIT</a>
    <nav class="nets" aria-label="Network">
      <a href="?net=mainnet" id="n-mainnet">MAINNET</a>
      <a href="?net=testnet" id="n-testnet" class="test">TESTNET</a>
    </nav>
  </header>

  <section>
    <h1>Unlock your <em>quantum</em> account.</h1>
    <p class="lede">Connect a Pera Quantum Account. The gate contract checks that a Falcon-1024 key signs for it, then unlocks FALQBIT. Classic accounts stay locked.</p>
  </section>

  <div id="notlive" class="warnbox" hidden></div>

  <section class="panel" aria-live="polite" id="status">
    <div class="row" id="r-wallet"><span class="dot"></span><div><div class="label">Wallet</div><div class="detail">Not connected</div></div></div>
    <div class="row" id="r-falcon"><span class="dot"></span><div><div class="label">Falcon-1024 key</div><div class="detail">Waiting for a wallet</div></div></div>
    <div class="row" id="r-token"><span class="dot"></span><div><div class="label">Token status</div><div class="detail">Waiting for a wallet</div></div></div>
  </section>

  <div class="actions" id="actions">
    <button class="primary" id="b-connect" type="button">Connect Pera Wallet</button>
    <button class="primary" id="b-activate" type="button" hidden>Reveal my Falcon key (0 ALGO self-payment)</button>
    <button class="primary" id="b-unlock" type="button" hidden>Unlock</button>
    <button class="ghost" id="b-disconnect" type="button" hidden>Disconnect</button>
  </div>
  <div id="msg" class="msg" hidden></div>

  <p class="foot" id="foot"></p>
</div>

<script type="module">
import {
  algosdk, NETWORKS, FEE_PQ, FEE_CALL, HOLDER_DEPOSIT, client, loadConfig, pickNetwork,
  findFalconKey, signerOf, selector, enc, holderBox, short,
} from "./falqbit.js";

const cfgAll = await loadConfig();
const net = pickNetwork() || (cfgAll.mainnet ? "mainnet" : "testnet");
const cfg = cfgAll[net];
const c = client(net);
const $ = (id) => document.getElementById(id);
$("n-" + net).setAttribute("aria-current", "true");

if (!cfg) {
  $("notlive").hidden = false;
  $("notlive").innerHTML = `<strong>FALQBIT is not live on ${NETWORKS[net].label} yet.</strong> Follow the launch on X, or try the full flow on <a href="?net=testnet">TestNet</a>.`;
  $("status").hidden = true; $("actions").hidden = true;
} else {
  $("foot").innerHTML = `${NETWORKS[net].label}. Gate app <a href="${c.n.lora}/application/${cfg.app_id}" target="_blank" rel="noopener" class="mono">${cfg.app_id}</a> · token <a href="${c.n.lora}/asset/${cfg.asset_id}" target="_blank" rel="noopener" class="mono">${cfg.asset_id}</a>.`
    + (net === "testnet" ? " Set Pera to TestNet first (Settings → Developer mode → TestNet) and fund your account from the TestNet dispenser." : "");
}

let account = null, found = null;

function setRow(id, state, detail) {
  const r = $(id); r.dataset.s = state; r.querySelector(".detail").textContent = detail;
}
function say(html, kind = "") {
  const m = $("msg"); m.hidden = !html; m.className = "msg " + kind; m.innerHTML = html;
}

async function refresh() {
  if (!account || !cfg) return;
  $("b-connect").hidden = true; $("b-disconnect").hidden = false;
  $("b-activate").hidden = true; $("b-unlock").hidden = true;

  const { info, signer } = await signerOf(c, account);
  const algo = info ? Number(info.amount) / 1e6 : 0;
  setRow("r-wallet", algo >= 0.2 ? "ok" : "warn",
    `${short(account)} · ${algo.toFixed(3)} ALGO${algo < 0.2 ? " · add some ALGO first" : ""}`);

  setRow("r-falcon", "busy", "Looking for your Falcon public key on-chain…");
  found = await findFalconKey(c, account, signer);
  if (!found) {
    setRow("r-falcon", "warn", "No Falcon-signed transaction found yet. If this is a Quantum Account, sign one 0 ALGO payment to yourself to reveal the public key.");
    $("b-activate").hidden = false;
    setRow("r-token", "", "Waiting for the Falcon key");
    return;
  }
  setRow("r-falcon", "ok", `Found · salt ${found.salt} · signer ${short(signer)}`);

  const holding = await c.algodGet(`/v2/accounts/${account}/assets/${cfg.asset_id}`);
  if (!holding) {
    setRow("r-token", "warn", "Not added yet. Unlock adds it and unlocks it in one step.");
  } else if (holding["asset-holding"]["is-frozen"]) {
    setRow("r-token", "warn", "Added, locked.");
  } else {
    setRow("r-token", "ok", `Unlocked · balance ${(Number(holding["asset-holding"].amount) / 1e6).toLocaleString()} FALQBIT`);
    return;
  }
  $("b-unlock").hidden = false;
  $("b-unlock").textContent = holding ? "Unlock" : "Add and unlock";
}

$("b-activate").addEventListener("click", async () => {
  try {
    say("Approve the request in Pera…");
    const txn = algosdk.makePaymentTxnWithSuggestedParamsFromObject({
      sender: account, receiver: account, amount: 0, suggestedParams: await c.params(FEE_PQ),
    });
    const { id } = await c.signAndSend([txn]);
    say(`Done. <a href="${c.n.lora}/transaction/${id}" target="_blank" rel="noopener">View on Lora</a>. Checking again…`, "ok");
    setTimeout(() => refresh().catch((e) => say(e.message, "err")), 4000);
  } catch (e) { say(e.message || String(e), "err"); }
});

$("b-unlock").addEventListener("click", async () => {
  try {
    $("b-unlock").disabled = true;
    say("Approve the request in Pera…");
    const txns = [];
    const holding = await c.algodGet(`/v2/accounts/${account}/assets/${cfg.asset_id}`);
    if (!holding) {
      txns.push(algosdk.makeAssetTransferTxnWithSuggestedParamsFromObject({
        sender: account, receiver: account, amount: 0, assetIndex: cfg.asset_id, suggestedParams: await c.params(FEE_PQ),
      }));
    }
    const box = await c.algodGet(`/v2/applications/${cfg.app_id}/box?name=b64:${btoa(String.fromCharCode(...holderBox(account)))}`);
    txns.push(algosdk.makePaymentTxnWithSuggestedParamsFromObject({
      sender: account, receiver: cfg.app_address, amount: box ? 0 : HOLDER_DEPOSIT, suggestedParams: await c.params(FEE_PQ),
    }));
    txns.push(algosdk.makeApplicationNoOpTxnFromObject({
      sender: account, appIndex: cfg.app_id, suggestedParams: await c.params(FEE_CALL),
      appArgs: [
        selector("unlock_falcon(pay,address,byte,byte[])void"),
        enc("address", account), enc("byte", found.salt), enc("byte[]", Array.from(found.pk)),
      ],
      foreignAssets: [cfg.asset_id],
      boxes: [{ appIndex: 0, name: holderBox(account) }],
    }));
    const { id } = await c.signAndSend(txns, {}, txns.length - 1);
    say(`Unlocked. <a href="${c.n.lora}/transaction/${id}" target="_blank" rel="noopener">View on Lora</a>`, "ok");
    await refresh();
  } catch (e) {
    say(e.message || String(e), "err");
  } finally {
    $("b-unlock").disabled = false;
  }
});

function disconnect() {
  c.pera.disconnect();
  account = null; found = null;
  $("b-connect").hidden = false;
  for (const id of ["b-disconnect", "b-activate", "b-unlock"]) $(id).hidden = true;
  setRow("r-wallet", "", "Not connected");
  setRow("r-falcon", "", "Waiting for a wallet");
  setRow("r-token", "", "Waiting for a wallet");
  say("");
}

$("b-connect").addEventListener("click", async () => {
  try {
    const accounts = await c.connect();
    c.pera.connector?.on("disconnect", disconnect);
    account = accounts[0];
    say("");
    await refresh();
  } catch (e) {
    if (e?.data?.type !== "CONNECT_MODAL_CLOSED") say(e.message || String(e), "err");
  }
});
$("b-disconnect").addEventListener("click", disconnect);

if (cfg) {
  c.reconnect().then((accounts) => {
    c.pera.connector?.on("disconnect", disconnect);
    if (accounts.length) { account = accounts[0]; refresh().catch((e) => say(e.message, "err")); }
  }).catch(() => {});
}
</script>
</body>
</html>
